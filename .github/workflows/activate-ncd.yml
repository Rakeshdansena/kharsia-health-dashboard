name: Activate NCD Module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add NCD module script
        shell: bash
        run: |
          set -e
          FILE="index_updated.html"
          if [ ! -f "$FILE" ]; then
            exit 0
          fi
          if grep -q 'js/ncd.js' "$FILE"; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('index_updated.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          tag = '<script src="js/ncd.js"></script>\n'
          if 'js/ncd.js' not in s and marker in s:
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit activation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_updated.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Activate modular NCD module"
          git push
