  box-shadow:0 8px 0 #071626,0 12px 20px rgba(2,8,23,.36),inset 0 1px 0 rgba(255,255,255,.24)!important;
  background:linear-gradient(145deg,#315778,#12334b)!important;
}
.menu-btn:active{
  transform:translateY(3px)!important;
  box-shadow:0 2px 0 #071626,0 4px 8px rgba(2,8,23,.25)!important;
}
.menu-btn.active{
  background:linear-gradient(145deg,#22c1b5,#087e8b)!important;
  border-color:rgba(153,246,228,.75)!important;
  box-shadow:0 5px 0 #07545b,0 9px 18px rgba(13,148,136,.35),inset 0 1px 0 rgba(255,255,255,.4)!important;
}
#dashboardPage .card{
  box-shadow:0 7px 0 rgba(30,64,90,.13),0 13px 26px rgba(15,45,75,.10)!important;
  transition:transform .18s ease,box-shadow .18s ease!important;
}
#dashboardPage .card:hover{
  transform:translateY(-4px)!important;
  box-shadow:0 10px 0 rgba(30,64,90,.12),0 18px 32px rgba(15,45,75,.15)!important;
}
