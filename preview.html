function injectFixes(){try{const d=f.contentDocument||f.contentWindow.document;if(!d||!d.head)return;let style=d.getElementById('jas-heading-visibility-fix');if(!style){style=d.createElement('style');style.id='jas-heading-visibility-fix';style.textContent='#jasMeetingModule{visibility:visible!important;opacity:1!important}#jasMeetingModule .jas-title{display:block!important;visibility:visible!important;opacity:1!important;text-align:center!important;font-size:18px!important;font-weight:800!important;margin:6px 0 14px!important;padding:10px!important;line-height:1.35!important}';d.head.appendChild(style)}const themeId='kharsia-safe-modern-home-theme';if(!d.getElementById(themeId)){const st=d.createElement('style');st.id=themeId;st.textContent="\n/* Safe visual refresh: app shell + dashboard home only.\n   Report tables and locked Ayushman/RCH module styling are intentionally untouched. */\n#kharsia-safe-modern-home-theme{ }\n.header{\n  background:linear-gradient(120deg,#102d52 0%,#075985 55%,#0f766e 100%)!important;\n  padding:16px 28px!important;\n  min-height:82px!important;\n  box-shadow:0 8px 24px rgba(15,23,42,.16)!important;\n  position:relative;\n}\n.header h1{font-weight:800!important;letter-spacing:.2px}\n.header small{display:inline-block;margin-top:5px!important;font-size:12px!important;opacity:.88}\n.sidebar{\n  background:linear-gradient(180deg,#10243b 0%,#0b1c30 100%)!important;\n  border-right:1px solid rgba(148,163,184,.18);\n  padding:18px 12px!important;\n}\n.sidebar-title{color:#a9d9df!important;font-weight:800;letter-spacing:1.1px}\n.menu-btn{\n  border:1px solid transparent!important;\n  border-radius:11px!important;\n  padding:11px 13px!important;\n  margin:4px 0!important;\n  transition:background .18s ease,border-color .18s ease,transform .18s ease!important;\n}\n.menu-btn:hover{background:rgba(45,212,191,.12)!important;border-color:rgba(94,234,212,.18)!important;transform:translateX(2px)}\n.menu-btn.active{background:linear-gradient(100deg,#
