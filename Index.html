<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kharsia Health Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#123f68;
    color:white;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}

.container{
    display:flex;
    min-height:calc(100vh - 65px);
}

.sidebar{
    width:230px;
    background:#0d3557;
    padding:15px;
}

button{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:0;
    border-radius:7px;
    background:#174d78;
    color:white;
    text-align:left;
    cursor:pointer;
}

button:hover{
    background:#1976b9;
}

.content{
    flex:1;
    padding:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px #ddd;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
    text-align:left;
}

th{
    background:#eaf1f7;
}

.loading{
    padding:15px;
    background:#fff7d6;
    border-radius:8px;
}

.error{
    padding:15px;
    background:#ffe1e1;
    color:#a00000;
    border-radius:8px;
}
</style>
</head>

<body>

    Kharsia Health Dashboard

<div class="container">

</button>

<button onclick="alert('Health & Wellness अगला चरण में जोड़ा जाएगा')">
🏥 Health & Wellness Center
</button>

<button onclick="alert('Ayushman Shivir अगला चरण में जोड़ा जाएगा')">
🏕️ Ayushman Shivir
</button>

<button onclick="alert('Wellness Activity अगला चरण में जोड़ा जाएगा')">
🩺 Wellness Activity
</button>

<button onclick="alert('RBSK अगला चरण में जोड़ा जाएगा')">

<button onclick="alert('NRC अगला चरण में जोड़ा जाएगा')">

<button onclick="alert('Blindness Control अगला चरण में जोड़ा जाएगा')">

🦠 NLEP

<div class="content">

<div id="dashboard" class="card">

<h1>Dashboard</h1>

<p>
Kharsia Block · District Raigarh · Chhattisgarh
</p>

<h3>Health Programme Dashboard</h3>

<p>
Left side से किसी programme पर क्लिक करें।
</p>

</div>


<div id="report" class="card" style="display:none">

<h1 id="reportTitle"></h1>

<div id="status" class="loading">
Google Sheet से data load हो रहा है...
</div>

<div style="overflow:auto">

<table id="dataTable">

<thead></thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

</div>


<script>

/* आपकी Google Sheet ID */

const SHEET_ID =
"1XAGjeCrLSVzTIraRSGkkjejXlrJEn-G2GxUEnN6ZCI0";


/* Ayushman Card का GID */

const AYUSHMAN_GID =
"925649620";


function showDashboard(){

    document.getElementById("dashboard")
        .style.display = "block";

    document.getElementById("report")
        .style.display = "none";

}


function openAyushman(){

    document.getElementById("dashboard")
        .style.display = "none";

    document.getElementById("report")
        .style.display = "block";

    document.getElementById("reportTitle")
        .innerText = "💳 Ayushman Card";

    document.getElementById("status")
        .className = "loading";

    document.getElementById("status")
        .innerText =
        "Google Sheet से data load हो रहा है...";

    loadAyushman();

}


function loadAyushman(){

    const url =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?gid=" +
        AYUSHMAN_GID +
        "&headers=1";

    fetch(url)

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }

        return response.text();

    })

    .then(function(text){

        const start =
            text.indexOf("{");

        const end =
            text.lastIndexOf("}");

        if(start === -1 || end === -1){

            throw new Error(
                "Google Sheet data नहीं मिला"
            );

        }

        const json =
            JSON.parse(
                text.substring(
                    start,
                    end + 1
                )
            );

        const cols =
            json.table.cols;

        const rows =
            json.table.rows;


        const thead =
            document.querySelector(
                "#dataTable thead"
            );

        const tbody =
            document.querySelector(
                "#dataTable tbody"
            );


        thead.innerHTML = "";
        tbody.innerHTML = "";


        /* HEADER */

        let headerRow =
            document.createElement("tr");


        cols.forEach(function(col){

            let th =
                document.createElement("th");

            th.innerText =
                col.label || "";

            headerRow.appendChild(th);

        });


        thead.appendChild(headerRow);


        /* DATA */

        rows.forEach(function(row){

            let tr =
                document.createElement("tr");


            cols.forEach(function(col,index){

                let td =
                    document.createElement("td");


                if(
                    row.c &&
                    row.c[index] &&
                    row.c[index].v !== null
                ){

                    td.innerText =
                        row.c[index].f ||
                        row.c[index].v;

                }
                else{

                    td.innerText = "";

                }


                tr.appendChild(td);

            });


            tbody.appendChild(tr);

        });


        document.getElementById("status")
            .className = "";

        document.getElementById("status")
            .innerText =
            "✓ Google Sheet से data successfully loaded";


    })

    .catch(function(error){

        document.getElementById("status")
            .className = "error";

        document.getElementById("status")
            .innerText =
            "Error: " + error.message;

    });

}

</script>

</body>
</html>
