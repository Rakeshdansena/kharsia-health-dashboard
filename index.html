<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kharsia Health Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fa}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboardFrame" src="index_updated.html?v=20260901-wellness-01" title="Kharsia Health Dashboard"></iframe>
<script>
const f=document.getElementById('dashboardFrame');
function injectFixes(){
  try{
    const d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.head)return;
    let style=d.getElementById('jas-heading-visibility-fix');
    if(!style){style=d.createElement('style');style.id='jas-heading-visibility-fix';style.textContent='#jasMeetingModule{display:block!important;visibility:visible!important;opacity:1!important}#jasMeetingModule .jas-title{display:block!important;visibility:visible!important;opacity:1!important;text-align:center!important;font-size:18px!important;font-weight:800!important;margin:6px 0 14px!important;padding:10px!important;line-height:1.35!important}';d.head.appendChild(style)}
    let jas=d.getElementById('jas-live-fix-script');
    if(!jas){jas=d.createElement('script');jas.id='jas-live-fix-script';jas.src='js/jas-live-fix.js?v=20260901-jas-07';d.head.appendChild(jas)}
    let hwc=d.getElementById('hwc-live-fix-script');
    if(!hwc){hwc=d.createElement('script');hwc.id='hwc-live-fix-script';hwc.src='js/hwc-live-fix.js?v=20260827-1';d.head.appendChild(hwc)}
    let wellness=d.getElementById('wellness-live-fix-script');
    if(!wellness){wellness=d.createElement('script');wellness.id='wellness-live-fix-script';wellness.src='js/wellness-live-fix.js?v=20260901-wellness-01';d.head.appendChild(wellness)}
    d.querySelectorAll('#menuButtons .menu-btn').forEach(b=>{
      if(/jas meeting/i.test(b.textContent||'')&&!b.dataset.jasParentHook){b.dataset.jasParentHook='1';b.addEventListener('click',function(){setTimeout(()=>{try{d.defaultView&&d.defaultView.dispatchEvent(new Event('jas-direct-open'))}catch(e){}},50)},true)}
    });
  }catch(e){console.error('Dashboard fix load error',e)}
}
f.addEventListener('load',()=>{injectFixes();setTimeout(injectFixes,500);setTimeout(injectFixes,1500);setTimeout(injectFixes,3000)});
setInterval(injectFixes,3000);
</script>
</body>
</html>
