<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kharsia Health Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fa}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboardFrame" src="index_updated.html?v=20260829-jas-01" title="Kharsia Health Dashboard"></iframe>
<script>
const f=document.getElementById('dashboardFrame');
f.addEventListener('load',function(){
  try{
    const d=f.contentDocument||f.contentWindow.document;
    const oldJas=d.getElementById('jas-live-fix-script');
    if(oldJas) oldJas.remove();
    const jas=d.createElement('script');
    jas.id='jas-live-fix-script';
    jas.src='js/jas-live-fix.js?v=20260829-jas-01';
    d.head.appendChild(jas);

    const oldHwc=d.getElementById('hwc-live-fix-script');
    if(oldHwc) oldHwc.remove();
    const hwc=d.createElement('script');
    hwc.id='hwc-live-fix-script';
    hwc.src='js/hwc-live-fix.js?v=20260827-1';
    d.head.appendChild(hwc);
  }catch(e){console.error('Dashboard fix load error',e)}
});
</script>
</body>
</html>
