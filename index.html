<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kharsia Health Dashboard</title>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial, sans-serif;
  background:#f2f4f7;
  color:#222;
}

.container{
  max-width:1500px;
  margin:auto;
}

.top-buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
  flex-wrap:wrap;
}

button{
  border:0;
  padding:10px 18px;
  border-radius:6px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.btn-print{
  background:#1976d2;
  color:white;
}

.btn-pdf{
  background:#388e3c;
  color:white;
}

.page{
  background:white;
  padding:18px;
  margin-bottom:25px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  page-break-after:always;
}

.page:last-child{
  page-break-after:auto;
}

.heading{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:5px 0 4px;
}

.sub-heading{
  text-align:center;
  font-size:14px;
  margin-bottom:15px;
  font-weight:bold;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:auto;
  font-size:13px;
}

th{
  background:#d9eaf7;
  border:1px solid #555;
  padding:8px 5px;
  text-align:center;
  font-weight:bold;
  white-space:normal;
}

td{
  border:1px solid #777;
  padding:6px 5px;
  text-align:center;
  white-space:nowrap;
}

/* Sector column */
td.sector{
  font-weight:bold;
  text-align:left;
}

/* Facility column */
td.facility{
  text-align:left;
  font-weight:500;
}

/* TOTAL */
.total-row td{
  font-weight:bold;
  background:#eeeeee;
  border-top:2px solid #333;
}

/* No special highlighted rows */
.normal-row{
  background:white !important;
}

.date-line{
  text-align:center;
  font-size:13px;
  margin-bottom:12px;
}

.loading{
  text-align:center;
  padding:30px;
  font-weight:bold;
}

.error{
  color:#c62828;
  text-align:center;
  padding:20px;
  font-weight:bold;
}

/* Page 2 */
.page2 table{
  font-size:14px;
}

.page2 th{
  background:#d9eaf7;
}

/* Print */
@media print{

  body{
    background:white;
    padding:0;
  }

  .top-buttons{
    display:none;
  }

  .page{
    box-shadow:none;
    margin:0;
    padding:8px;
    page-break-after:always;
  }

  table{
    font-size:10px;
  }

  th,td{
    padding:4px 3px;
  }

  .heading{
    font-size:18px;
  }
}

/* Mobile */
@media(max-width:800px){

  body{
    padding:8px;
  }

  .page{
    padding:8px;
  }

  .heading{
    font-size:18px;
  }

  table{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top-buttons">
    <button class="btn-print" onclick="window.print()">
      🖨️ Print
    </button>

    <button class="btn-pdf" onclick="makePDF()">
      📄 PDF
    </button>
  </div>


  <!-- =====================================================
       PAGE 1 : FY 2026-27
       ===================================================== -->

  <section class="page" id="page2026">

    <div class="heading" id="heading2026">
      RCH 2.0 PW Registration Detail FY 2026-27
    </div>

    <div class="date-line" id="date2026">
      As on Date: -
    </div>

    <div id="table2026">
      <div class="loading">
        2026-27 का data load हो रहा है...
      </div>
    </div>

  </section>


  <!-- =====================================================
       PAGE 2 : FY 2025-26
       ===================================================== -->

  <section class="page page2" id="page2025">

    <div class="heading" id="heading2025">
      RCH 2.0 PW Registration Detail FY 2025-26
    </div>

    <div class="date-line" id="date2025">
      As on Date: -
    </div>

    <div id="table2025">
      <div class="loading">
        2025-26 का data load हो रहा है...
      </div>
    </div>

  </section>

</div>


<script>

/* ==========================================================
   GOOGLE SHEET URL
   ==========================================================

   नीचे अपनी Google Sheet की Published CSV URL डालें।

   Example:

   https://docs.google.com/spreadsheets/d/XXXXX/gviz/tq?tqx=out:csv&gid=0

   यदि दोनों data एक ही sheet में हैं तो अलग-अलग gid
   या अलग sheet/tab की URL इस्तेमाल करें।
   ========================================================== */

const SHEET_URL_2026 =
"https://docs.google.com/spreadsheets/d/XXXXXXXXXXXX/gviz/tq?tqx=out:csv&gid=0";

const SHEET_URL_2025 =
"https://docs.google.com/spreadsheets/d/XXXXXXXXXXXX/gviz/tq?tqx=out:csv&gid=1";


/* ==========================================================
   CSV READER
   ========================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let insideQuotes=false;

  for(let i=0;i<text.length;i++){

    const char=text[i];
    const next=text[i+1];

    if(char === '"' && insideQuotes && next === '"'){
      cell+='"';
      i++;
      continue;
    }

    if(char === '"'){
      insideQuotes=!insideQuotes;
      continue;
    }

    if(char === ',' && !insideQuotes){
      row.push(cell.trim());
      cell="";
      continue;
    }

    if((char === '\n' || char === '\r') && !insideQuotes){

      if(char === '\r' && next === '\n'){
        i++;
      }

      row.push(cell.trim());
      cell="";

      if(row.some(x=>x!=="")){
        rows.push(row);
      }

      row=[];
      continue;
    }

    cell+=char;
  }

  if(cell!=="" || row.length){
    row.push(cell.trim());
    if(row.some(x=>x!=="")){
      rows.push(row);
    }
  }

  return rows;
}


/* ==========================================================
   CLEAN TEXT
   ========================================================== */

function clean(value){

  if(value===undefined || value===null){
    return "";
  }

  return String(value)
    .replace(/\*\*/g,"")
    .replace(/<br\s*\/?>/gi," ")
    .trim();
}


/* ==========================================================
   NUMBER
   ========================================================== */

function num(value){

  const v=clean(value)
    .replace(/,/g,"")
    .replace("%","");

  if(v==="") return "";

  const n=Number(v);

  if(Number.isNaN(n)){
    return clean(value);
  }

  return n;
}


/* ==========================================================
   FIND HEADER ROW
   ========================================================== */

function findHeader(rows){

  for(let i=0;i<rows.length;i++){

    const line=rows[i]
      .map(x=>clean(x).toLowerCase())
      .join(" | ");

    if(
      line.includes("sn") &&
      line.includes("sector") &&
      line.includes("hfr")
    ){
      return i;
    }
  }

  return -1;
}


/* ==========================================================
   FIND TITLE / DATE
   ========================================================== */

function findTitle(rows, defaultTitle){

  for(let i=0;i<Math.min(rows.length,10);i++){

    const text=rows[i]
      .map(clean)
      .join(" ")
      .trim();

    if(
      text.toLowerCase().includes("rch 2.0") &&
      text.toLowerCase().includes("registration")
    ){
      return text;
    }
  }

  return defaultTitle;
}


function findDate(rows){

  for(let i=0;i<Math.min(rows.length,10);i++){

    const text=rows[i]
      .map(clean)
      .join(" ");

    const match=text.match(
      /(?:as on date|date)\s*[:\-]?\s*(\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4})/i
    );

    if(match){
      return match[1];
    }
  }

  return "";
}


/* ==========================================================
   MAKE TABLE 2026
   ========================================================== */

function makeTable2026(rows){

  const headerIndex=findHeader(rows);

  if(headerIndex===-1){
    throw new Error("2026-27 में table heading नहीं मिली।");
  }

  const headers=[
    "Sn",
    "Sector",
    "HFR ID",
    "Health Facility",
    "Health Facility Type",
    "HMIS PW Registration",
    "RCH 2.0 PW Registration",
    "%",
    "Tem. Registration",
    "Backlog",
    "High Risk"
  ];

  let html=`
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
  `;

  headers.forEach(h=>{
    html+=`<th>${h}</th>`;
  });

  html+=`
        </tr>
      </thead>
      <tbody>
  `;


  /*
    IMPORTANT:

    केवल पहली 42 rows ली जाएंगी।

    इसके बाद अगर Google Sheet में 1-8
    वाली FY 2025-26 table है तो उसे IGNORE किया जाएगा।
  */

  let count=0;
  let total=[0,0,0,0,0,0];


  for(let i=headerIndex+1;i<rows.length && count<42;i++){

    const r=rows[i];

    if(!r || r.length<5) continue;

    const sn=clean(r[0]);

    /*
      केवल 1 से 42 तक numeric Sn
    */
    if(!/^\d+$/.test(sn)) continue;

    const snNumber=Number(sn);

    if(snNumber<1 || snNumber>42) continue;


    /*
      Total row को skip
    */
    if(
      clean(r[0]).toLowerCase()==="total" ||
      clean(r[0]).toLowerCase()==="totals"
    ){
      continue;
    }


    const sector=clean(r[1]);
    const hfr=clean(r[2]);
    const facility=clean(r[3]);
    const type=clean(r[4]);

    const hmis=num(r[5]);
    const rch=num(r[6]);
    const percent=num(r[7]);
    const temp=num(r[8]);
    const backlog=num(r[9]);
    const highRisk=num(r[10]);


    /*
      Total calculation
    */
    total[0]+=Number(hmis)||0;
    total[1]+=Number(rch)||0;
    total[2]+=Number(percent)||0;
    total[3]+=Number(temp)||0;
    total[4]+=Number(backlog)||0;
    total[5]+=Number(highRisk)||0;


    /*
      सभी rows normal हैं।
      कोई special highlight नहीं।
    */

    html+=`
      <tr class="normal-row">

        <td>${snNumber}</td>

        <td class="sector">
          ${sector}
        </td>

        <td>${hfr}</td>

        <td class="facility">
          ${facility}
        </td>

        <td>${type}</td>

        <td>${hmis}</td>

        <td>${rch}</td>

        <td>${percent}</td>

        <td>${temp}</td>

        <td>${backlog}</td>

        <td>${highRisk}</td>

      </tr>
    `;

    count++;
  }


  /*
    Total row
  */

  html+=`
      <tr class="total-row">

        <td>Total</td>

        <td></td>

        <td></td>

        <td></td>

        <td></td>

        <td>${total[0]}</td>

        <td>${total[1]}</td>

        <td>${count ? Math.round((total[1]/total[0])*100) : ""}</td>

        <td>${total[3]}</td>

        <td>${total[4]}</td>

        <td>${total[5]}</td>

      </tr>
  `;


  html+=`
      </tbody>
    </table>
    </div>
  `;

  return html;
}


/* ==========================================================
   MAKE TABLE 2025
   ========================================================== */

function makeTable2025(rows){

  const headerIndex=findHeader(rows);

  if(headerIndex===-1){
    throw new Error("2025-26 में table heading नहीं मिली।");
  }


  const headers=[
    "Sn",
    "Sector",
    "HFR ID",
    "Health Facility",
    "Health Facility Type",
    "HMIS PW Registration",
    "RCH 2.0 PW Registration",
    "%",
    "Tem. Registration",
    "Backlog",
    "High Risk"
  ];


  let html=`
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
  `;

  headers.forEach(h=>{
    html+=`<th>${h}</th>`;
  });

  html+=`
        </tr>
      </thead>
      <tbody>
  `;


  let count=0;

  let totalHMIS=0;
  let totalRCH=0;
  let totalTemp=0;
  let totalBacklog=0;
  let totalHighRisk=0;


  /*
    FY 2025-26 में केवल 1 से 8
  */

  for(let i=headerIndex+1;i<rows.length && count<8;i++){

    const r=rows[i];

    if(!r || r.length<5) continue;

    const sn=clean(r[0]);

    if(!/^\d+$/.test(sn)) continue;

    const snNumber=Number(sn);

    if(snNumber<1 || snNumber>8) continue;


    const sector=clean(r[1]);
    const hfr=clean(r[2]);
    const facility=clean(r[3]);
    const type=clean(r[4]);

    const hmis=num(r[5]);
    const rch=num(r[6]);
    const percent=num(r[7]);
    const temp=num(r[8]);
    const backlog=num(r[9]);
    const highRisk=num(r[10]);


    totalHMIS+=Number(hmis)||0;
    totalRCH+=Number(rch)||0;
    totalTemp+=Number(temp)||0;
    totalBacklog+=Number(backlog)||0;
    totalHighRisk+=Number(highRisk)||0;


    html+=`
      <tr class="normal-row">

        <td>${snNumber}</td>

        <td class="sector">
          ${sector}
        </td>

        <td>${hfr}</td>

        <td class="facility">
          ${facility}
        </td>

        <td>${type}</td>

        <td>${hmis}</td>

        <td>${rch}</td>

        <td>${percent}</td>

        <td>${temp}</td>

        <td>${backlog}</td>

        <td>${highRisk}</td>

      </tr>
    `;

    count++;
  }


  html+=`
      <tr class="total-row">

        <td>Total</td>

        <td></td>

        <td></td>

        <td></td>

        <td></td>

        <td>${totalHMIS}</td>

        <td>${totalRCH}</td>

        <td>${totalHMIS ? Math.round((totalRCH/totalHMIS)*100) : ""}</td>

        <td>${totalTemp}</td>

        <td>${totalBacklog}</td>

        <td>${totalHighRisk}</td>

      </tr>
  `;


  html+=`
      </tbody>
    </table>
    </div>
  `;

  return html;
}


/* ==========================================================
   LOAD 2026
   ========================================================== */

async function load2026(){

  try{

    const response=await fetch(
      SHEET_URL_2026 + "&t=" + Date.now()
    );

    if(!response.ok){
      throw new Error("Google Sheet open नहीं हो रही है।");
    }

    const text=await response.text();

    const rows=parseCSV(text);

    const title=findTitle(
      rows,
      "RCH 2.0 PW Registration Detail FY 2026-27"
    );

    const date=findDate(rows);


    document.getElementById("heading2026").innerText=
      title || "RCH 2.0 PW Registration Detail FY 2026-27";


    document.getElementById("date2026").innerText=
      date ? "As on Date: " + date : "";


    document.getElementById("table2026").innerHTML=
      makeTable2026(rows);

  }
  catch(error){

    console.error(error);

    document.getElementById("table2026").innerHTML=
      `<div class="error">
        2026-27 का data load नहीं हो पाया।<br>
        Google Sheet URL check करें।
      </div>`;
  }
}


/* ==========================================================
   LOAD 2025
   ========================================================== */

async function load2025(){

  try{

    const response=await fetch(
      SHEET_URL_2025 + "&t=" + Date.now()
    );

    if(!response.ok){
      throw new Error("Google Sheet open नहीं हो रही है।");
    }

    const text=await response.text();

    const rows=parseCSV(text);

    const title=findTitle(
      rows,
      "RCH 2.0 PW Registration Detail FY 2025-26"
    );

    const date=findDate(rows);


    document.getElementById("heading2025").innerText=
      title || "RCH 2.0 PW Registration Detail FY 2025-26";


    document.getElementById("date2025").innerText=
      date ? "As on Date: " + date : "";


    document.getElementById("table2025").innerHTML=
      makeTable2025(rows);

  }
  catch(error){

    console.error(error);

    document.getElementById("table2025").innerHTML=
      `<div class="error">
        2025-26 का data load नहीं हो पाया।<br>
        Google Sheet URL check करें।
      </div>`;
  }
}


/* ==========================================================
   PDF
   ========================================================== */

function makePDF(){

  const element=document.querySelector(".container");

  const options={
    margin:5,
    filename:"Kharsia_Health_RCH_Report.pdf",
    image:{
      type:"jpeg",
      quality:0.98
    },
    html2canvas:{
      scale:2,
      useCORS:true
    },
    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"landscape"
    },
    pagebreak:{
      mode:["css","legacy"]
    }
  };

  html2pdf()
    .set(options)
    .from(element)
    .save();
}


/* ==========================================================
   START
   ========================================================== */

load2026();
load2025();

</script>

</body>
</html>
