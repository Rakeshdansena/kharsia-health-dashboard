<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kharsia Health Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- SIDEBAR MENU -->
    <div class="sidebar">
      <div class="sidebar-header">HEALTH PROGRAMMES</div>
      <ul class="nav-menu">
        <li class="nav-item active" id="dashboard-menu" onclick="showDashboardView()">🏠 Dashboard</li>
        <li class="nav-item" id="menu-ayushman" onclick="loadReportView('ayushman')">💳 Ayushman Card</li>
        <li class="nav-item" id="menu-rch" onclick="loadReportView('rch')">🤱 RCH 2.0</li>
        <li class="nav-item" id="menu-rbsk" onclick="loadReportView('rbsk')">👶 RBSK</li>
        <li class="nav-item" id="menu-nrc" onclick="loadReportView('nrc')">🏥 NRC Kharsia</li>
        <li class="nav-item" id="menu-blindness" onclick="loadReportView('blindness')">👁️ Blindness Control</li>
        <li class="nav-item" id="menu-nqas" onclick="loadReportView('nqas')">🏅 NQAS Certification</li>
        <li class="nav-item" id="menu-dialysis" onclick="loadReportView('dialysis')">💧 Dialysis</li>
        <li class="nav-item" id="menu-nlep" onclick="loadReportView('nlep')">🩺 NLEP</li>
      </ul>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER -->
      <header>
        <span style="font-size: 24px;">🏥</span>
        <div>
          <h1>Kharsia Health Dashboard</h1>
          <p>Block Kharsia · District Raigarh · Chhattisgarh</p>
        </div>
      </header>

      <!-- DYNAMIC CONTENT AREA -->
      <div class="content-area" id="main-content">
        <!-- जावास्क्रिप्ट द्वारा डेटा यहाँ लोड होगा -->
      </div>

    </div>

  </div>

  <!-- SCRIPT FILES LOAD -->
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
