<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kharsia Health Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fa}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboardFrame" src="index_updated.html" title="Kharsia Health Dashboard"></iframe>
<script>
(function(){
  const frame=document.getElementById('dashboardFrame');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc || doc.getElementById('ncd-module-loader')) return;
      const s=doc.createElement('script');
      s.id='ncd-module-loader';
      s.src='js/ncd.js';
      s.onload=function(){
        try{ frame.contentWindow.console && frame.contentWindow.console.log('NCD module loaded'); }catch(e){}
      };
      doc.body.appendChild(s);
    }catch(e){
      console.error('NCD module injection failed',e);
    }
  });
})();
</script>
</body>
</html>
