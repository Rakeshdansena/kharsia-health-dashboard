<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kharsia Health Dashboard</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f6fa}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="dashboardFrame" src="index_updated.html?v=20260826-jas6" title="Kharsia Health Dashboard"></iframe>
<script>
(function(){
  const frame=document.getElementById('dashboardFrame');
  frame.addEventListener('load',function(){
    try{
      const win=frame.contentWindow,doc=frame.contentDocument;
      if(!doc)return;
      function inject(id,src){
        if(doc.getElementById(id))return;
        const s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s);
      }
      inject('ncd-module-loader','js/ncd.js?v=20260825-ncd3');
      inject('jas-meeting-module-loader','js/jas-meeting.js?v=20260826-jas6');
      const runJAS=()=>{if(typeof win.renderJASMeeting==='function')setTimeout(()=>win.renderJASMeeting(),100)};
      doc.addEventListener('click',function(ev){
        const el=ev.target.closest('button,.menu-btn,.card');
        if(el && /JAS\s*Meeting/i.test(el.textContent||''))setTimeout(runJAS,500);
      },true);
      const obs=new MutationObserver(function(){
        const title=doc.getElementById('reportTitle');
        if(title && /JAS\s*Meeting/i.test(title.textContent||''))runJAS();
      });
      obs.observe(doc.body,{subtree:true,childList:true,characterData:true});
    }catch(e){console.error('Module injection failed',e)}
  });
})();
</script>
</body>
</html>
